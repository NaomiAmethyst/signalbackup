name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke-test the CLI end to end
        run: |
          python -m tests.fixture "${RUNNER_TEMP}/demo"
          KEY=dtjs858asj6tv0jzsqrsmj0ubp335pisj98e9ssnss8myoc08drhtcktyawvx45l
          sigbackup verify "${RUNNER_TEMP}/demo" --key "$KEY" --deep
          sigbackup export "${RUNNER_TEMP}/demo" --key "$KEY" \
            -m "${RUNNER_TEMP}/media" -o "${RUNNER_TEMP}/out.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert len(d['messages'])==7, d" \
            "${RUNNER_TEMP}/out.json"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
